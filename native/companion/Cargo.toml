[package]
name = "backend"
version = "1.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22.1"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png"] }
serde_json = "1.0.145"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Foundation",
    "Foundation_Collections",
    "Media",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
windows-future = "0.3.2"

[profile.release]
strip = true
debug = 0

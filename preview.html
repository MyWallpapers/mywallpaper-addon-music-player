<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music Player · Layout preview</title><style>
html{overflow-x:clip}body{overflow-x:clip;position:relative;isolation:isolate;margin:0;background:#102331;color:#fff;font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:22px 30px}h1{margin:0;font-size:20px;font-weight:500}header p{margin:0;color:#c4d1da;font-size:13px}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;max-width:1560px;margin:auto;padding:20px 30px 60px}.example{min-width:0}.example>h2{font-size:14px;font-weight:400;color:#d6e2e9;margin:0 0 10px}.example .host{min-height:200px}.mp-stage{padding:0!important}main .example[data-layout="visualizer"]{grid-column:span 2}.mp-stage{height:auto!important}.example[data-layout="compact"]{grid-column:span 2}button{font:inherit}header button{background:#243b4b;color:#fff;border:1px solid #698398;border-radius:20px;padding:8px 14px;cursor:pointer}header button:focus-visible{outline:2px solid white;outline-offset:3px}body:before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(155deg,#35597488,#794f6377 40%,#061622dd),url('/assets/demo-cover.webp') center/cover;filter:blur(35px);transform:scale(1.08)}@media(max-width:850px){main{grid-template-columns:repeat(2,minmax(0,1fr));padding:20px;gap:24px}.example[data-layout="visualizer"],.example[data-layout="compact"]{grid-column:span 2}}@media(max-width:550px){header{padding:20px}main{grid-template-columns:minmax(0,1fr)}main .example{grid-column:auto!important}}
.thumbnail header{display:none}.thumbnail main{display:flex;align-items:center;justify-content:center;padding:0;min-height:100vh}.thumbnail .example{width:min(480px,calc(100vw - 80px))}.thumbnail .example>h2{display:none}.thumbnail .host{min-height:0}
</style></head><body><header><h1>Music Player</h1><p>Layout preview · synthetic track metadata, no Windows playback</p><button id="empty">Show empty states</button></header><main id="preview"></main><script type="module" src="/src/preview.ts"></script></body></html>
